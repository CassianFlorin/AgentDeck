name: AgentDeck
options:
  bundleIdPrefix: com.cassianflorin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Public half of the update-signing key (scripts/setup-update-key.sh).
    # The private half is the SPARKLE_ED_PRIVATE_KEY repo secret.
    SPARKLE_PUBLIC_ED_KEY: "/Vtf2a3VvELEvQPYTTpuKisZjK7VKa5KCfI7CWStb5Q="

targets:
  AgentDeck:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # App icon (regenerate with scripts/make-appicon.sh)
      - path: Resources/Assets.xcassets
    resources: []
    dependencies:
      # Built by scripts/build-ghosttykit.sh from the vendor/ghostty submodule.
      # Not committed: it is a ~100MB static library.
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      # In-app updater. Fetched by scripts/fetch-sparkle.sh (not committed).
      - framework: vendor/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
    postBuildScripts:
      # libghostty looks for shell-integration / terminfo / themes under
      # Contents/Resources/ghostty. Without it shell integration (cwd, titles,
      # command-finished events) silently does nothing.
      - name: Copy Ghostty resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${PROJECT_DIR}/vendor/ghostty-resources"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -d "$SRC/ghostty" ]; then
            echo "error: vendor/ghostty-resources missing, run scripts/build-ghosttykit.sh"
            exit 1
          fi
          rsync -a --delete "$SRC/ghostty/" "$DST/ghostty/"
          rsync -a --delete "$SRC/terminfo/" "$DST/terminfo/"
          # Shell integration wraps `ssh` etc. as "$GHOSTTY_BIN_DIR/ghostty +ssh …".
          # Point that at ourselves; GhosttyRuntime runs the CLI action and exits.
          ln -sf "${EXECUTABLE_NAME}" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/ghostty"
    info:
      path: Support/Info.plist
      properties:
        # UI is Chinese; this also makes system menus and date formatting Chinese.
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleName: AgentDeck
        CFBundleDisplayName: AgentDeck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 CassianFlorin. MIT License."
        # Shown when a program running in a terminal asks for these (it inherits
        # the terminal's permissions). Matches the entitlements in Support/.
        NSAppleEventsUsageDescription: "终端里运行的程序想要控制其他 App（例如 osascript）。"
        NSMicrophoneUsageDescription: "终端里运行的程序想要使用麦克风。"
        NSCameraUsageDescription: "终端里运行的程序想要使用摄像头。"
        NSContactsUsageDescription: "终端里运行的程序想要访问通讯录。"
        NSCalendarsUsageDescription: "终端里运行的程序想要访问日历。"
        NSLocationUsageDescription: "终端里运行的程序想要获取位置。"
        NSPhotoLibraryUsageDescription: "终端里运行的程序想要访问照片。"
        # Sparkle (Sources/App/AppUpdater.swift). Release CI publishes
        # appcast.xml with every GitHub Release; "latest" redirects to it.
        SUFeedURL: "https://github.com/CassianFlorin/AgentDeck/releases/latest/download/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: true
        # Check the EdDSA signature before unpacking anything.
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cassianflorin.agentdeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-lstdc++"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Terminal apps spawn arbitrary shells; App Sandbox would break that.
        ENABLE_APP_SANDBOX: NO
      configs:
        # Debug: ad-hoc signed, no certificate needed. Anyone can clone and build.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: NO
        # Release: Developer ID + hardened runtime, for notarization.
        # Built by scripts/package.sh (locally and in CI). Contributors without
        # the certificate should use Debug.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: HU729D6ML5
          CODE_SIGN_ENTITLEMENTS: Support/AgentDeck.entitlements
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # GhosttyKit is built for the native arch only (-Dxcframework-target=native).
          # Apple silicon only for now; a universal build would need
          # -Dxcframework-target=universal (about twice the Zig build time).
          ARCHS: arm64

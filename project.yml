name: AgentDeck
options:
  bundleIdPrefix: com.cassianflorin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AgentDeck:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources: []
    dependencies:
      # Built by scripts/build-ghosttykit.sh from the vendor/ghostty submodule.
      # Not committed: it is a ~100MB static library.
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    postBuildScripts:
      # libghostty looks for shell-integration / terminfo / themes under
      # Contents/Resources/ghostty. Without it shell integration (cwd, titles,
      # command-finished events) silently does nothing.
      - name: Copy Ghostty resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${PROJECT_DIR}/vendor/ghostty-resources"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -d "$SRC/ghostty" ]; then
            echo "error: vendor/ghostty-resources missing, run scripts/build-ghosttykit.sh"
            exit 1
          fi
          rsync -a --delete "$SRC/ghostty/" "$DST/ghostty/"
          rsync -a --delete "$SRC/terminfo/" "$DST/terminfo/"
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: AgentDeck
        CFBundleDisplayName: AgentDeck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 CassianFlorin. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cassianflorin.agentdeck
        OTHER_LDFLAGS: "-lstdc++"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Terminal apps spawn arbitrary shells; App Sandbox would break that.
        ENABLE_APP_SANDBOX: NO
      configs:
        # Debug: ad-hoc signed, no certificate needed. Anyone can clone and build.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: YES

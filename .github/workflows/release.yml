name: Release

# Push a tag to release:   git tag v0.1.0 && git push origin v0.1.0
# or run it by hand from the Actions tab (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v, e.g. 0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize & publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Tags, so the appcast's change list can start at the previous release.
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Never fall back to an ad-hoc / unnotarized build: users would have to
      # bypass Gatekeeper by hand. Missing credentials = failed release.
      - name: Check signing & notarization secrets
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for v in CERT_P12_BASE64 CERT_P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; missing=1; fi
          done
          exit $missing

      - uses: ./.github/actions/ghosttykit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PW=$(uuidgen)
          echo "$CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # A keychain-exported .p12 only carries the leaf certificate; add
          # Apple's Developer ID G2 intermediate or codesign can't build the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o $RUNNER_TEMP/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f $RUNNER_TEMP/cert.p12 $RUNNER_TEMP/DeveloperIDG2CA.cer
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write notarization & update-signing keys
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          echo "$NOTARY_KEY" > $RUNNER_TEMP/notary.p8
          printf '%s' "$SPARKLE_KEY" > $RUNNER_TEMP/sparkle.key

      - name: Build, sign & notarize
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_KEY_PATH: ${{ runner.temp }}/sparkle.key
        run: scripts/package.sh "${{ steps.v.outputs.version }}"

      - name: Remove keys
        if: always()
        run: rm -f ${{ runner.temp }}/notary.p8 ${{ runner.temp }}/sparkle.key

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<'EOF'
          ## 安装

          下载 `AgentDeck-*.dmg`，把 AgentDeck 拖进「应用程序」即可。
          已使用 Apple Developer ID 签名并通过 Apple 公证，可以直接打开，不需要右键或在「隐私与安全性」里放行。
          需要 macOS 14 或更新版本（Apple 芯片）。

          已经装了 AgentDeck 的话，在菜单「AgentDeck → 检查更新…」里就能直接更新（0.2.0 起）。

          `.sha256` 文件里是 DMG / ZIP 的校验值。`appcast.xml` 是应用内更新用的。
          EOF
          FILES=(build/dist/AgentDeck-$VERSION.dmg build/dist/AgentDeck-$VERSION.zip build/dist/AgentDeck-$VERSION.sha256 build/dist/appcast.xml)
          for f in "${FILES[@]}"; do test -f "$f" || { echo "::error::missing $f"; exit 1; }; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release replaces its assets instead of failing.
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "AgentDeck $VERSION" \
              --notes-file "$NOTES" --generate-notes
          fi
